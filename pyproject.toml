[project]
name = "notion-qotd"
version = "0.1.0"
description = "Publish a daily quote curated in Notion"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "loguru>=0.7,<1",
    "notion-client>=2,<4",
    "python-dotenv>=1,<2",
]

[project.scripts]
qotd = "qotd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qotd"]

[tool.hatch.build]
exclude = [".env", ".venv", ".idea", ".pytest_cache", ".ruff_cache", "__pycache__", "dist", "logs"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = ["D203", "D213", "D400", "D415"] # 中文句号不被 pydocstyle 识别

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
